# Publish GazePoint SDKs when a version tag is pushed to this umbrella repo.
#
# Trigger:
#   git tag v2.1.0
#   git push origin v2.1.0
#
# One-time setup (required before the first run):
# 1) pub.dev → package gazepoint_sdk → Admin → Automated publishing
#    - Enable GitHub Actions
#    - Repository: Tareq-Ghassan/FaceDetection-GazePoint
#    - Tag pattern: v{{version}}
# 2) GitHub repo Settings → Secrets → Actions
#    - Add SUBMODULES_TOKEN (PAT with contents:write on all GazePointSDK-* repos:
#      Android, iOS, Flutter, Web, Windows, macOS, Linux)
#
# Tag format must be vX.Y.Z and must match flutter/pubspec.yaml version.

name: Publish SDKs

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag / versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Parse version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version derived from tag: $TAG"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION (tag $TAG)"

      - name: Require flutter/pubspec.yaml version == tag
        working-directory: flutter
        run: |
          PUBSPEC_VERSION="$(ruby -ryaml -e "puts YAML.load_file('pubspec.yaml')['version']")"
          echo "pubspec version: $PUBSPEC_VERSION"
          if [ "$PUBSPEC_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::flutter/pubspec.yaml is '$PUBSPEC_VERSION' but tag is 'v${{ steps.version.outputs.version }}'"
            echo "Bump the package version on main before tagging."
            exit 1
          fi

  publish-flutter:
    name: Publish Flutter → pub.dev
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Dart (OIDC for pub.dev)
        uses: dart-lang/setup-dart@v1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        working-directory: flutter
        run: flutter pub get

      - name: Install Pana
        run: dart pub global activate pana 0.23.17

      - name: Run Pana Analysis
        working-directory: flutter
        run: |
          echo "📊 Running Pana Package Analysis..."
          pana --no-warning --json > pana-report.json || true
          
          # Display summary
          echo ""
          echo "=== PANA ANALYSIS RESULTS ==="
          cat pana-report.json | jq -r '
            "📦 Package: \(.packageName) v\(.packageVersion)",
            "",
            "🎯 SCORES:",
            "  Overall: \(.scores.grantedPoints)/\(.scores.maxPoints) points",
            "  Documentation: \(.derivedTags | map(select(. | startswith("sdk:")) | . ) | length) platforms documented",
            "",
            "✅ Granted Points: \(.scores.grantedPoints)",
            "📊 Max Points: \(.scores.maxPoints)",
            "⚠️  Lost Points: \(.scores.lostPoints)",
            "",
            "Platform Support:",
            (.derivedTags | map(select(. | startswith("platform:"))) | join(", "))
          '
          
          # Check if score is acceptable (>= 100 points recommended)
          SCORE=$(cat pana-report.json | jq -r '.scores.grantedPoints')
          MAX_SCORE=$(cat pana-report.json | jq -r '.scores.maxPoints')
          echo ""
          if [ "$SCORE" -ge 100 ]; then
            echo "✅ Package score is excellent: $SCORE/$MAX_SCORE points"
          elif [ "$SCORE" -ge 80 ]; then
            echo "⚠️  Package score is good but could be improved: $SCORE/$MAX_SCORE points"
          else
            echo "❌ Package score needs improvement: $SCORE/$MAX_SCORE points"
            echo "::warning::Package score is below 80 points. Consider improving before publishing."
          fi

      - name: Upload Pana Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pana-report
          path: flutter/pana-report.json

      - name: Dry-run
        working-directory: flutter
        run: dart pub publish --dry-run

      - name: Publish
        working-directory: flutter
        run: dart pub publish --force

  release-native:
    name: Tag All Platform Submodules
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve submodule SHAs
        id: shas
        run: |
          echo "android=$(git rev-parse HEAD:android)" >> "$GITHUB_OUTPUT"
          echo "ios=$(git rev-parse HEAD:ios)" >> "$GITHUB_OUTPUT"
          echo "flutter=$(git rev-parse HEAD:flutter)" >> "$GITHUB_OUTPUT"
          echo "web=$(git rev-parse HEAD:web)" >> "$GITHUB_OUTPUT"
          echo "windows=$(git rev-parse HEAD:windows)" >> "$GITHUB_OUTPUT"
          echo "macos=$(git rev-parse HEAD:macos)" >> "$GITHUB_OUTPUT"
          echo "linux=$(git rev-parse HEAD:linux)" >> "$GITHUB_OUTPUT"
          echo "Android SHA: $(git rev-parse HEAD:android)"
          echo "iOS SHA:     $(git rev-parse HEAD:ios)"
          echo "Flutter SHA: $(git rev-parse HEAD:flutter)"
          echo "Web SHA:     $(git rev-parse HEAD:web)"
          echo "Windows SHA: $(git rev-parse HEAD:windows)"
          echo "macOS SHA:   $(git rev-parse HEAD:macos)"
          echo "Linux SHA:   $(git rev-parse HEAD:linux)"

      - name: Tag all submodule repos
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          ANDROID_SHA: ${{ steps.shas.outputs.android }}
          IOS_SHA: ${{ steps.shas.outputs.ios }}
          FLUTTER_SHA: ${{ steps.shas.outputs.flutter }}
          WEB_SHA: ${{ steps.shas.outputs.web }}
          WINDOWS_SHA: ${{ steps.shas.outputs.windows }}
          MACOS_SHA: ${{ steps.shas.outputs.macos }}
          LINUX_SHA: ${{ steps.shas.outputs.linux }}
          TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${TOKEN:-}" ]; then
            echo "::error::SUBMODULES_TOKEN secret is not set."
            echo "Create a PAT with contents:write on all GazePointSDK-* repositories:"
            echo "  - GazePointSDK-Android"
            echo "  - GazePointSDK-iOS"
            echo "  - GazePointSDK-Flutter"
            echo "  - GazePointSDK-Web"
            echo "  - GazePointSDK-Windows"
            echo "  - GazePointSDK-macOS"
            echo "  - GazePointSDK-Linux"
            echo "Then add it as repo secret SUBMODULES_TOKEN (Settings → Secrets and variables → Actions)."
            echo "See .agents/RELEASE.md for more details."
            exit 1
          fi

          tag_repo() {
            local repo="$1"
            local sha="$2"
            local tag="$3"
            local dir
            dir="$(mktemp -d)"

            echo "Tagging $repo @ $sha as $tag"
            git clone \
              "https://x-access-token:${TOKEN}@github.com/Tareq-Ghassan/${repo}.git" \
              "$dir"
            git -C "$dir" fetch --tags origin
            git -C "$dir" fetch origin "$sha"
            git -C "$dir" checkout "$sha"

            if git -C "$dir" rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              existing="$(git -C "$dir" rev-list -n 1 "$tag")"
              if [ "$existing" = "$sha" ]; then
                echo "✓ Tag $tag already exists on $repo at the same commit"
              else
                echo "::error::Tag $tag already exists on $repo at $existing (wanted $sha)"
                exit 1
              fi
            else
              git -C "$dir" tag "$tag" "$sha"
              git -C "$dir" push origin "refs/tags/$tag"
              echo "✓ Pushed $repo tag $tag"
            fi
          }

          # Tag all platform SDKs with version (without leading "v")
          echo "🏷️  Tagging all platform submodules with version $VERSION..."
          tag_repo "GazePointSDK-Android" "$ANDROID_SHA" "v$VERSION"
          tag_repo "GazePointSDK-iOS" "$IOS_SHA" "v$VERSION"
          tag_repo "GazePointSDK-Flutter" "$FLUTTER_SHA" "v$VERSION"
          tag_repo "GazePointSDK-Web" "$WEB_SHA" "v$VERSION"
          tag_repo "GazePointSDK-Windows" "$WINDOWS_SHA" "v$VERSION"
          tag_repo "GazePointSDK-macOS" "$MACOS_SHA" "v$VERSION"
          tag_repo "GazePointSDK-Linux" "$LINUX_SHA" "v$VERSION"

          echo ""
          echo "✅ All submodules tagged successfully!"
          echo ""
          echo "📦 Platform SDK Releases:"
          echo "  • Android (JitPack): com.github.Tareq-Ghassan:GazePointSDK-Android:v${VERSION}"
          echo "  • iOS (SPM): https://github.com/Tareq-Ghassan/GazePointSDK-iOS/releases/tag/v${VERSION}"
          echo "  • Flutter (pub.dev): https://pub.dev/packages/gazepoint_sdk/versions/${VERSION}"
          echo "  • Web (NPM): https://github.com/Tareq-Ghassan/GazePointSDK-Web/releases/tag/v${VERSION}"
          echo "  • Windows (NuGet): https://github.com/Tareq-Ghassan/GazePointSDK-Windows/releases/tag/v${VERSION}"
          echo "  • macOS (SPM): https://github.com/Tareq-Ghassan/GazePointSDK-macOS/releases/tag/v${VERSION}"
          echo "  • Linux (Source): https://github.com/Tareq-Ghassan/GazePointSDK-Linux/releases/tag/v${VERSION}"

          # Trigger JitPack build for Android
          echo ""
          echo "🚀 Triggering JitPack build for Android..."
          curl -fsSL \
            "https://jitpack.io/api/builds/com.github.Tareq-Ghassan/GazePointSDK-Android/v${VERSION}" \
            || echo "::warning::JitPack trigger request failed (you can retry in the JitPack UI)"
